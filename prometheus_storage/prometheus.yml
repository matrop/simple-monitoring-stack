global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.

scrape_configs:
  - job_name: "api" 
    static_configs:
      - targets: ["api:8080"] # This refers to the service name in docker-compose.yml

  - job_name: "prometheus" 
    static_configs:
      - targets: ["localhost:9090"]